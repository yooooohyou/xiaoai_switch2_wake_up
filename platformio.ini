; PlatformIO Project Configuration File
;
; Matter 要求 arduino-esp32 >= 3.x
; 使用 pioarduino 平台（官方 espressif32 的 3.x 分支）
; https://github.com/pioarduino/platform-espressif32

[env:airm2m_core_esp32c3]
; arduino-esp32 3.x，内置 Matter SDK
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
; 使用标准 ESP32-C3 DevKit 板定义（与 airm2m 硬件兼容）
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
build_flags =
    ; 使用 UART0 作为 Serial（不用 USB CDC，避免与 Matter/BLE 冲突）
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; 禁用 CHIP Shell 以减小固件体积
    -DCONFIG_ENABLE_CHIP_SHELL=0
    ; Matter SDK 网络层：ESP32 LwIP 提供 BSD socket API，两个 flag 均需设置
    -DCHIP_SYSTEM_CONFIG_USE_LWIP=1
    -DCHIP_SYSTEM_CONFIG_USE_SOCKETS=1
; Matter 需要 matter_kvs 分区，替换原 huge_app.csv
board_build.partitions = partitions_matter.csv
; Matter 所需库已内置于 arduino-esp32 3.x 框架
