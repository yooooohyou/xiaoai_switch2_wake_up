; PlatformIO Project Configuration File
;
; 版本 8.0：统一固件（巴法云 / 涂鸦 / 通用 MQTT + 网页 OTA）
; 使用标准 espressif32 平台，编译更快，固件更小

[env:airm2m_core_esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200

; OTA 需要两个 app 分区互为备份，huge_app.csv 只有一个分区所以不能用。
; min_spiffs.csv 在 4MB flash 下给 app0/app1 各约 1.9MB。
;
; 如果编译提示 app 分区放不下（Bluedroid + WiFi + TLS 一起比较占地方），
; 办法是把蓝牙协议栈换成 NimBLE，能省 300~500KB：
;   lib_deps 加 h2zero/NimBLE-Arduino，并把 src/main.cpp 里的 BLE 部分
;   改用 NimBLEDevice.h 的接口。这个项目只发广播不做连接，NimBLE 完全够用。
board_build.partitions = min_spiffs.csv

platform_packages =
    platformio/toolchain-riscv32-esp@~14.2.0

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0

build_flags =
    ; 使用 UART0 作为 Serial（不用 USB CDC，避免与 BLE 冲突）
    -DARDUINO_USB_CDC_ON_BOOT=0
